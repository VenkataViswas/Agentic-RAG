[project]
name = "agenticrag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "venkataviswas", email = "tumbalivenkataviswas@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "black>=26.10.1",
    "isort>=9.0.2",
    "langchain>=1.4.6",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.2",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.3",
    "langchain-unstructured>=1.0.1",
    "langgraph>=1.2.16",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
agenticrag = "agenticrag.main:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
